---
job: extension
config:
  name: "bombifikator_klombu_lora_v1"
  process:
    - type: 'sd_trainer'
      training_folder: "/root/training/output"
      device: cuda:0
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 200
        max_step_saves_to_keep: 10
      datasets:
        - folder_path: "/root/training/single_klombu"
          caption_ext: "txt"
          caption_dropout_rate: 0.0
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 768, 1024 ]
      train:
        batch_size: 1
        cache_text_embeddings: true
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "Qwen/Qwen-Image"
        arch: "qwen_image"
        quantize: true
        qtype: "qfloat8"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: true
      sample:
        sampler: "flowmatch"
        sample_every: 200
        sample_start_step: 0
        width: 1024
        height: 1024
        prompts:
          - "klombu, flat cel shaded cartoon character with heavy black outlines on a plain white background"
          - "klombu portrait close up, flat cel shaded cartoon character with heavy black outlines on a plain white background"
          - "klombu standing in a desert holding a rifle, flat cel shaded cartoon with heavy black outlines"
          - "klombu sitting on a red couch, flat cel shaded cartoon with heavy black outlines"
        neg: "photograph, photorealistic skin, blurry, scenery"
        seed: 42
        walk_seed: false
        guidance_scale: 3
        sample_steps: 25
meta:
  name: "[name]"
  version: '1.0'
