---
job: extension
config:
  name: "bombifikator_identity_lora_v3"
  process:
    - type: 'sd_trainer'
      training_folder: "/root/training/output"
      device: cuda:0
      network:
        type: "lora"
        linear: 128
        linear_alpha: 128
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 2
      datasets:
        - folder_path: "/workspace/training/identity"
          caption_ext: "txt"
          caption_dropout_rate: 0.0
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 768, 1024 ]
      train:
        batch_size: 1
        cache_text_embeddings: true
        steps: 10000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "Qwen/Qwen-Image"
        arch: "qwen_image"
        quantize: true
        qtype: "qfloat8"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: true
      sample:
        sampler: "flowmatch"
        sample_every: 500
        sample_start_step: 0
        width: 1024
        height: 1024
        prompts:
          - "bmb31, flat cel shaded cartoon character with heavy black outlines on a plain white background"
          - "bmb08, flat cel shaded cartoon character with heavy black outlines on a plain white background"
          - "bmb31, standing with both arms raised, flat cel shaded cartoon character with heavy black outlines on a plain white background"
          - "bmb20, sitting with hands on knees, flat cel shaded cartoon character with heavy black outlines on a plain white background"
        neg: "photograph, photorealistic skin, blurry, scenery"
        seed: 42
        walk_seed: true
        guidance_scale: 3
        sample_steps: 25
meta:
  name: "[name]"
  version: '1.0'
