[logging]
level = "INFO"

[codex]
raw_dir = "data/codex/raw"
characters_dir = "data/codex/characters"
ledger_path = "data/codex/processed.json"
requests_per_second = 1.0
timeout_seconds = 30.0
min_wikitext_length = 200

[codex.extraction]
model = "claude-opus-5"
max_tokens = 4000
effort = "low"
concurrency = 6
max_wikitext_characters = 24000

[harvester]
episodes_dir = "data/episodes"
frames_dir = "data/frames"
format_selector = "bv*[vcodec^=avc1][ext=mp4]/bv*[ext=mp4]/bv*/b"
player_clients = ["default", "android", "tv_simply"]

[harvester.frames]
content_threshold = 27.0
min_shot_seconds = 0.4
sample_stride_seconds = 3.0
min_mean_luminance = 12.0
min_laplacian_variance = 60.0
min_pixel_standard_deviation = 18.0

[[harvester.sources]]
name = "kapitan-bomba-odcinki"
url = "https://www.youtube.com/playlist?list=PLHtUOYOPwzJGGZkjR-FspIL17YtSBGaCR"

[[harvester.sources]]
name = "zemsta-faraona"
url = "https://www.youtube.com/watch?v=iLW3ivu8IiI"

[[harvester.sources]]
name = "kutapokalipsa"
url = "https://www.youtube.com/watch?v=eL5Cmj70rTc"

[[codex.sites]]
name = "bombaverse"
api_url = "https://bombaversearchive.fandom.com/pl/api.php"
article_base_url = "https://bombaversearchive.fandom.com/pl/wiki/"
category_namespace = "Kategoria"

[reference_builder]
crops_dir = "data/references/crops"
sheets_dir = "data/references/sheets"
references_dir = "data/references/cards"
embeddings_path = "data/references/embeddings.npz"
clusters_path = "data/references/clusters.toml"
labels_path = "data/references/labels.toml"

[reference_builder.detection]
model_id = "IDEA-Research/grounding-dino-base"
text_prompt = "a cartoon character. a person. a monster."
box_threshold = 0.3
text_threshold = 0.25
batch_size = 8
device = "auto"
crop_padding_ratio = 0.08
min_crop_pixels = 96
max_crops_per_frame = 6
max_frame_coverage_ratio = 0.85
duplicate_iou_threshold = 0.55

[reference_builder.embedding]
model_id = "facebook/dinov2-base"
batch_size = 64
device = "auto"

[reference_builder.clustering]
min_cluster_size = 12
min_samples = 4
pca_components = 64
sheet_grid_size = 3
sheet_tile_pixels = 256

[reference_builder.labeling]
model = "claude-opus-5"
max_tokens = 2000
effort = "medium"
concurrency = 6
prominences = ["MAIN", "RECURRING"]

[reference_builder.selection]
target_references = 16
thin_reference_threshold = 10
min_label_confidence = 0.6
remove_background = true

[transform]
output_dir = "data/output"
weights_dir = "data/weights"

[transform.segmentation]
model_id = "yolo11x-seg.pt"
confidence_threshold = 0.3
min_person_area_ratio = 0.002
device = "auto"

[transform.description]
model = "claude-sonnet-5"
max_tokens = 2000
effort = "medium"

[transform.matching]
allow_thin_coverage = true

[transform.rendering]
model_id = "Qwen/Qwen-Image-Edit-2509"
transformer_repo_id = "nunchaku-tech/nunchaku-qwen-image-edit-2509"
transformer_file = "svdq-fp4_r128-qwen-image-edit-2509.safetensors"
base_model_id = "Qwen/Qwen-Image"
base_transformer_repo_id = "nunchaku-ai/nunchaku-qwen-image"
base_transformer_file = "svdq-fp4_r128-qwen-image.safetensors"
lora_path = "data/loras/identity.safetensors"
device = "auto"
inference_steps = 40
true_cfg_scale = 4.0
seed = 42
render_pixels = 1024
erase_dilation_ratio = 0.02
plate_feather_pixels = 25

[training]
tokens_path = "data/training/tokens.toml"
dataset_dir = "data/training/identity"
token_prefix = "bmb"
image_size = 1024
minimum_references = 10
